<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 70" width="100%" height="70" role="img" aria-label="Hi, I am Zam">
  <defs>
    <style><![CDATA[
      .c {
        font-family: 'Fira Code', 'Courier New', Courier, monospace;
        font-size: 30px;
        font-weight: 700;
        fill: #f59e0b;
        opacity: 0;
        transform: translateY(32px);
        animation: charCycle 12s cubic-bezier(0.34, 1.56, 0.64, 1) infinite both;
      }

      @media (prefers-color-scheme: dark) {
        .c {
          fill: #fbbf24;
        }
      }

      @keyframes charCycle {
        0% {
          opacity: 0;
          transform: translateY(32px);
        }
        2.5% {
          opacity: 1;
          transform: translateY(-5px);
        }
        4% {
          opacity: 1;
          transform: translateY(0);
        }
        25% {
          opacity: 1;
          transform: translateY(0);
        }
        28% {
          opacity: 0;
          transform: translateY(-28px);
        }
        29%, 100% {
          opacity: 0;
          transform: translateY(32px);
        }
      }
    ]]></style>
  </defs>

  <!-- Sequence 1: "Hi, I am Zam" -->
  <g id="phrase1">
    <text x="217" y="45" class="c" style="animation-delay: 0.00s;">H</text>
    <text x="235" y="45" class="c" style="animation-delay: 0.04s;">i</text>
